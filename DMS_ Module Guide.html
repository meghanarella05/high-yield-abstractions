<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DMS: Module Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="data:,">
<style>
:root{--bg:#fff;--fg:#1c1b22;--card:#f3f2f8;--ac:#5b3df5;--mut:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121a;--fg:#ecebf4;--card:#1d1c28;--ac:#9d8bff;--mut:#a09fb3}}
:root[data-theme="dark"]{--bg:#13121a;--fg:#ecebf4;--card:#1d1c28;--ac:#9d8bff;--mut:#a09fb3}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:12px;max-width:760px}
h1{font-size:20px;margin:6px 0}nav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
nav a{background:var(--card);color:var(--ac);border:1px solid var(--ac);border-radius:14px;padding:3px 10px;font-size:13px;text-decoration:none}
details{background:var(--card);border-radius:10px;margin:10px 0;padding:8px 12px}summary{font-weight:700;cursor:pointer}
.a{border-left:4px solid var(--ac);padding-left:8px;margin:8px 0}.x{color:var(--mut);font-size:13.5px}
.c{margin:10px 0 4px;padding-top:6px;border-top:1px dashed var(--mut)}.c b{color:var(--ac)}ol{padding-left:20px;margin:4px 0}
</style></head><body>
<h1>Discrete Mathematics (DMS): modules</h1>
<p class="x">Six modules, one per CO. Each = <b>core abstraction</b>, then per concept: <b>abstraction</b> → <b>derive it</b>, ending with the trap examiners plant. No code.</p>
<nav id="nav"></nav><div id="app"></div>
<script>
const M=[
{id:'co1',t:'CO1 · Relations, posets, lattices, Boolean algebra',a:'A ladder where each rung is the previous one plus one rule: relation → (add order) poset → (add lub and glb for every pair) lattice → (add distributive and complemented) Boolean algebra. Answer any question by naming the rung and checking its one new rule.',
k:[
['Relations and their types','Test four properties, then name the combination.',['Reflexive: every (a,a) present. Symmetric: aRb gives bRa. Antisymmetric: aRb and bRa force a=b. Transitive: aRb and bRc give aRc','Equivalence = reflexive + symmetric + transitive; its classes partition the set (count them, no overlaps)','Partial order = reflexive + antisymmetric + transitive','Matrix shortcuts: diagonal all 1 (reflexive); M = Mᵀ (symmetric); no off-diagonal pair both 1 (antisymmetric)','Counting on n elements: all 2^(n²), reflexive 2^(n²−n), symmetric 2^(n(n+1)/2)','Trap: antisymmetric is not "not symmetric" (identity is both); one missing (a,a) kills reflexivity']],
['Posets and Hasse diagrams','A partial order drawn with the redundant lines removed.',['Draw: drop self-loops, drop edges implied by transitivity, put smaller elements lower, drop arrowheads','Maximal/minimal: nothing strictly above/below. Greatest/least: above/below everything (unique if it exists)','Chain: every pair comparable. Antichain: none comparable','Dilworth: minimum chains covering the poset = size of largest antichain','Divisors of n under divisibility: Dₙ has d(n) elements','Trap: maximal is not greatest; ({2,3,4,5}, divides) has maximal 3,4,5 and no greatest']],
['Lattices','Every pair needs a join (lub) and a meet (glb).',['Test every pair; one failing pair means not a lattice','In Dₙ: join = lcm, meet = gcd','Distributive: a∧(b∨c) = (a∧b)∨(a∧c); non-distributive exactly when it contains the diamond M₃ or pentagon N₅','Complement of a: a∨a′ = 1 and a∧a′ = 0 (needs a top and bottom); complemented = every element has one','Dₙ is complemented (and Boolean) exactly when n is square-free','Trap: complemented alone is not Boolean, it must also be distributive']],
['Boolean algebra, DNF and CNF','A complemented distributive lattice; a finite one with n atoms has 2ⁿ elements.',['Laws: De Morgan, absorption x+xy = x, complement x+x′ = 1, idempotent','DNF: take each row where f = 1, write a product (variable plain if 1, complemented if 0), OR them','CNF: take each row where f = 0, write a sum (variable plain if 0, complemented if 1), AND them','Simplify at the end by absorption/combining','Trap: CNF flips the convention; use the 0-rows and complement the variables that are 1']]]},
{id:'co2',t:'CO2 · Combinatorics',a:'Counting = decide what is being chosen: does order matter, can items repeat, are some identical, is there a restriction? Each formula is the answer to one combination of those questions; generating functions and inclusion–exclusion handle constraints.',
k:[
['Permutations and combinations','Ask the questions in order.',['Order matters, no repeats: P(n,r) = n!/(n−r)!. Order doesn’t matter: C(n,r)','Repeats allowed, order matters: nʳ','Repeats allowed, order doesn’t matter (stars and bars): C(n+r−1, r), n = types, r = items','Identical objects in an arrangement: n!/(n₁!n₂!…)','Circular: (n−1)!. "Together": glue into a block, multiply by internal order. "Never together": total − together','Trap: in C(n+r−1, r) don’t swap n and r']],
['Generating functions','Turn each choice into a polynomial, multiply, read one coefficient.',['Factor per item: used 0..k times → 1+x+…+xᵏ; unlimited → 1/(1−x); at least once → x/(1−x); even only → 1/(1−x²)','Multiply the factors; answer for r objects = coefficient of xʳ','Toolkit: 1/(1−x)ᵏ = Σ C(n+k−1, n)xⁿ','Lower bound xᵢ ≥ a: pull out xᵃ first, then find the shifted coefficient','Order matters (arrangements): use the exponential GF, answer = r! × coefficient','Trap: the answer is one coefficient, not the whole expansion']],
['Inclusion–exclusion and derangements','Add singles, subtract overlaps, alternate.',['Two sets: |A∪B| = |A|+|B|−|A∩B|; three: singles − pairs + triple','"None of the properties" = N − |union|; divisibility intersections use ⌊N/lcm⌋','Derangement Dₙ = n!(1 − 1/1! + 1/2! − … ± 1/n!); D₁..D₅ = 0, 1, 2, 9, 44; Dₙ = (n−1)(Dₙ₋₁ + Dₙ₋₂)','Exactly r fixed points = C(n,r)·Dₙ₋ᵣ','Trap: exactly r fixed is not Dₙ; and don’t drop the + on the triple intersection']],
['Partitions, compositions, Ferrers','Same sums, ordered or unordered.',['Composition = ordered sum: total 2ⁿ⁻¹, exactly k parts C(n−1, k−1)','Partition = unordered: p(1..6) = 1, 2, 3, 5, 7, 11; list largest part first','Ferrers diagram: row i has as many dots as the i-th part; conjugate = read columns','Exactly k parts ↔ largest part k (conjugate); self-conjugate = symmetric about the diagonal','Euler: partitions into distinct parts = partitions into odd parts','Trap: if 1+3 and 3+1 count separately it is compositions']],
['Fike’s ordering (check against class notes)','Your textbook file has nothing on it, so this is the standard rank/unrank by factorials method.',['Rank (from 0): for each position count smaller elements to its right → cᵢ; rank = Σ cᵢ·(n−i)!','Unrank: divide by (n−1)!, (n−2)!, …; each quotient says pick the cᵢ-th smallest unused element','Next permutation: rightmost i with aᵢ less than aᵢ₊₁, swap with the smallest larger element to its right, reverse the tail','Trap: count only among elements to the right, and start rank at 0']]]},
{id:'co3',t:'CO3 · Graphs',a:'A graph is vertices plus edges, and most questions are either a quick necessary-condition check by counting degrees and edges, or a short procedure (Havel–Hakimi, colouring, Dijkstra). Check the cheap conditions first.',
k:[
['Degrees and handshaking','Every edge adds 2 to the total degree.',['Σdeg(v) = 2|E|, so the sum is always even and odd-degree vertices come in pairs','A candidate degree sequence needs even sum and every term ≤ n−1','Trap: run these two checks before Havel–Hakimi; examiners give odd sums or terms above n−1']],
['Havel–Hakimi','Peel off the largest vertex and see if the rest still works.',['Sort non-increasing','Remove the first term d₁; subtract 1 from the next d₁ terms','Any negative term → not graphical, stop','Re-sort and repeat; empty or all-zero list → graphical','Connectedness: path between every pair; cut vertex or bridge removal disconnects','Trap: re-sort every round']],
['Isomorphism and self-complementary','Disprove with one mismatch; prove with an explicit map.',['Compare invariants: |V|, |E|, degree sequence, components, girth; one mismatch disproves','If all match, build a bijection f with (u,v) ∈ E₁ exactly when (f(u),f(v)) ∈ E₂','Self-complementary (G ≅ complement): edges must be n(n−1)/4, so n ≡ 0 or 1 (mod 4)','Trap: the mod-4 test only rules cases out; to show it you must exhibit the isomorphism']],
['Bipartite graphs and trees','Two-colourable means no odd cycle.',['Bipartite: BFS/DFS 2-colouring; a same-colour edge means not bipartite','Tree = connected + acyclic; with n vertices any of these implies the rest: connected with n−1 edges, acyclic with n−1 edges, unique path between every pair','Leaf = degree 1; a tree with n ≥ 2 has at least 2 leaves; forest edges = vertices − components','Spanning tree = tree subgraph containing every vertex','Trap: acyclic alone is not a tree (a forest is acyclic)']],
['Euler, Hamilton, matrices','Euler is about edges (clean test); Hamilton is about vertices (no clean test).',['Eulerian circuit: connected and all degrees even; Eulerian path: connected with exactly two odd vertices','Hamiltonian: only sufficient conditions, e.g. Dirac (n ≥ 3, every degree ≥ n/2)','Adjacency matrix A (n×n, symmetric); incidence matrix (vertices × edges, columns sum to 2); walks of length k from i to j = entry (i,j) of Aᵏ','Trap: failing Dirac proves nothing; one odd vertex kills the Euler circuit']],
['Dijkstra','Grow a set of finished vertices outward from the source.',['dist[source] = 0, all others infinity, all unvisited','Pick the unvisited vertex with the smallest dist and mark it visited (now final)','Relax its neighbours: if dist[u] + w is smaller, update dist and predecessor','Repeat until target or all visited; path = walk predecessors back','Trap: never update a visited vertex; fails on negative weights']]]},
{id:'co4',t:'CO4 · Groups',a:'A group is a set with an operation where you can always combine, regroup, do nothing and undo. The ladder is semigroup → monoid → group → abelian, and every proof checks the properties in that order, stopping at the first failure.',
k:[
['Semigroup, monoid, group','Each rung adds one requirement.',['Semigroup: closure + associativity','Monoid: plus an identity e','Group: plus an inverse for every element; abelian: also commutative','Unique identity, unique inverses, cancellation (a*b = a*c gives b = c)','Check in order: closure, associativity, identity, inverses','Trap: (a*b)⁻¹ = b⁻¹*a⁻¹, order flips']],
['Groups in ℤₙ','Addition always works; multiplication needs units.',['(ℤₙ, +ₙ) is always a group: identity 0, inverse of a is n−a','(ℤₙ, ×ₙ) is generally only a monoid (identity 1)','Fix: units ℤₙ* = {a : gcd(a,n) = 1} under ×ₙ is a group of order φ(n); for prime p, nonzero elements give a group of order p−1','Trap: don’t assume multiplication mod n is a group']],
['Subgroups','A subset that is a group under the same operation.',['Fast reject: is e in H? If not, not a subgroup','One-step test: H nonempty and a*b⁻¹ ∈ H (additive: a−b ∈ H) for all a, b in H','Two-step alternative: closed under the operation and under inverses','{e} and G are always subgroups; intersection of subgroups is a subgroup; union usually is not','Trap: check e ∈ H first']],
['Cosets and Lagrange','Cosets slice the group into equal pieces.',['Left coset aH = {a*h : h in H}; cosets partition G and all have size |H|','List cosets: pick an uncovered g, compute gH, mark covered, repeat','Lagrange: |H| divides |G|; number of cosets = |G|/|H| (the index); element orders also divide |G|','Trap: not every divisor of |G| gives a subgroup (A₄ has no subgroup of order 6)']],
['Cyclic groups','One generator builds everything.',['G = ⟨a⟩ = {aᵏ}; order of a = smallest n with aⁿ = e','k generates ℤₙ exactly when gcd(k,n) = 1; number of generators = φ(n)','Every cyclic group is abelian (not conversely); every subgroup of a cyclic group is cyclic, one for each divisor d of n','Order of aᵏ in a cyclic group of order n is n/gcd(n,k)','Trap: generator means gcd(k,n) = 1, not "k divides n"']]]},
{id:'co5',t:'CO5 · Logic and inference',a:'Logic is an algebra of truth values. A proof is a chain of valid rule applications, each cited. Predicate logic adds quantifiers, so you strip them, reason on instances, then restore them.',
k:[
['Equivalences and implication','Rewrite, then test.',['P→Q is false only when P true and Q false','P→Q ≡ ¬P∨Q ≡ ¬Q→¬P (contrapositive); ¬(P→Q) ≡ P∧¬Q; De Morgan for ∧ and ∨; P↔Q ≡ (P→Q)∧(Q→P)','Tautology always true, contradiction always false: truth table (2ⁿ rows) or simplify','A ⇒ B: assume A true and B false; a forced contradiction proves it','Trap: converse and inverse are not equivalent to P→Q, only the contrapositive is']],
['Propositional inference','Number premises, derive one line at a time, cite the rule.',['MP: P, P→Q ⊢ Q · MT: P→Q, ¬Q ⊢ ¬P · HS: P→Q, Q→R ⊢ P→R · DS: P∨Q, ¬P ⊢ Q','Simplification P∧Q ⊢ P · Conjunction P, Q ⊢ P∧Q · Addition P ⊢ P∨Q','Conditional proof: to prove A→B add A as a premise and derive B','Indirect proof: add ¬conclusion and derive a contradiction','Trap: affirming the consequent and denying the antecedent are invalid']],
['Predicates and quantifiers','Statements about a domain.',['∀ = every element; ∃ = at least one','Negation swaps quantifiers: ¬∀x P ≡ ∃x ¬P; ¬∃x P ≡ ∀x ¬P','Translate: "all S are P" → ∀x(S→P); "some S are P" → ∃x(S∧P)','Nested order matters: ∀x∃y(x less than y) is true on ℤ, ∃y∀x is false','Bound vs free variables; no free variables = a statement','Trap: ∀ pairs with →, ∃ pairs with ∧']],
['Predicate inference','Strip, reason, restore.',['Rules: UI (∀x P ⊢ P(c)), EI (∃x P ⊢ P(c) for a new c), UG (P(c) with c arbitrary ⊢ ∀x P), EG (P(c) ⊢ ∃x P)','Do EI first, then UI, so the EI constant is genuinely new','Apply the propositional rules (MP, MT, HS) on the instances','Restore quantifiers with EG or UG','Trap: never use UG on a constant that came from EI']]]},
{id:'co6',t:'CO6 · Matrix decompositions',a:'Rewrite a matrix as a product of simpler matrices whose structure you can exploit. LU comes from systematic row elimination; SVD comes from the eigen-analysis of AᵀA.',
k:[
['LU decomposition','Record the elimination steps as L.',['Goal A = LU: L lower triangular with 1s on the diagonal, U upper triangular','Start with U = copy of A, L = identity','For each pivot column k and each row i below: multiplier m = U[i][k] / U[k][k]','Store m in L[i][k]; apply Rᵢ → Rᵢ − m·Rₖ to U','Check: multiply L·U and compare with A','Trap: a zero pivot breaks plain LU (needs row swaps); L’s diagonal is 1s, not the pivots']],
['SVD','A = UΣVᵀ: V from the eigenvectors of AᵀA, Σ from their eigenvalues, U from the link between them.',['Compute AᵀA (n×n symmetric)','Eigenvalues λ₁ ≥ λ₂ ≥ … ≥ 0; singular values σ = √λ down the diagonal of Σ','Eigenvectors of AᵀA, normalised to unit length, are the columns of V','For each σ ≠ 0: u = (1/σ)·A·v gives the columns of U; extend by Gram–Schmidt if more are needed','Assemble Σ (m×n, σ on the diagonal), verify A = UΣVᵀ','Check example: A = [[3,0],[4,5]] gives AᵀA = [[25,20],[20,25]], λ = 45 and 5, σ = 3√5 and √5, v = (1,1)/√2 and (1,−1)/√2','Trap: normalise the eigenvectors, and use AᵀA (not AAᵀ) for V']]]}];
const nav=document.getElementById('nav'),app=document.getElementById('app');
M.forEach((m,i)=>{const a=document.createElement('a');a.href='#'+m.id;a.textContent=m.id.toUpperCase();nav.append(a);
const d=document.createElement('details');d.id=m.id;if(!i)d.open=true;
d.innerHTML='<summary>'+m.t+'</summary><div class="a"><b>Core abstraction:</b> '+m.a+'</div>'+m.k.map(k=>'<div class="c"><b>'+k[0]+'</b><br><span class="x">'+k[1]+'</span><ol>'+k[2].map(s=>'<li>'+s+'</li>').join('')+'</ol></div>').join('');app.append(d)});
function op(){const e=document.getElementById(location.hash.slice(1));if(e&&e.tagName=='DETAILS')e.open=true}
addEventListener('hashchange',op);op();
</script></body></html>
